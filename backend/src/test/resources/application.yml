server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:metlab;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    defer-datasource-initialization: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  sql:
    init:
      mode: never
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

logging:
  level:
    root: WARN
    com.metrology: INFO
