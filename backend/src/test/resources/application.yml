server:
  port: 0

spring:
  datasource:
    # COLLATION ... STRENGTH PRIMARY：对齐生产 MySQL utf8mb4_unicode_ci 的大小写不敏感比较，
    # 器具编号大小写等价规则才能在 H2 测试里被真实覆盖
    url: jdbc:h2:mem:metlab;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;COLLATION=ENGLISH STRENGTH PRIMARY
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    defer-datasource-initialization: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  sql:
    init:
      mode: never
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

logging:
  level:
    root: WARN
    com.metrology: INFO
